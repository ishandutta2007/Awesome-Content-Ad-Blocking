<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic floating particles & waves in background */
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }

    @keyframes pulseRing {
      0% { r: 35px; opacity: 0.7; stroke-width: 2px; }
      50% { r: 60px; opacity: 0.1; stroke-width: 1px; }
      100% { r: 35px; opacity: 0.7; stroke-width: 2px; }
    }

    @keyframes dataStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes shieldGlow {
      0% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 20px rgba(129, 140, 248, 0.8)); }
      100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
    }

    .bg-node { animation: floatParticle 6s ease-in-out infinite; }
    .bg-node-delayed { animation: floatParticle 8s ease-in-out 2s infinite; }
    .bg-node-slow { animation: floatParticle 10s ease-in-out 4s infinite; }
    .radar-pulse { animation: pulseRing 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .stream-line { stroke-dasharray: 10, 15; animation: dataStream 3s linear infinite; }
    .shield-icon { animation: shieldGlow 4s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .gradient-word {
      fill: url(#primary-grad);
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }

    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="none" stroke="#1e293b" stroke-width="2" rx="16" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Kept strictly behind and around borders) -->
  <g opacity="0.45">
    <!-- Grid Network Lines -->
    <line x1="100" y1="0" x2="100" y2="360" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,6" />
    <line x1="1100" y1="0" x2="1100" y2="360" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,6" />
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,6" />
    <line x1="0" y1="290" x2="1200" y2="290" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,6" />

    <!-- Animated Data Stream Lines -->
    <path d="M 60 180 Q 200 90 350 180 T 600 180" fill="none" stroke="#38bdf8" stroke-width="2" class="stream-line" opacity="0.6" />
    <path d="M 600 180 Q 750 270 900 180 T 1140 180" fill="none" stroke="#818cf8" stroke-width="2" class="stream-line" opacity="0.6" />

    <!-- Floating Background Particles (Glowing Nodes) -->
    <circle cx="160" cy="90" r="4" fill="#38bdf8" class="bg-node" />
    <circle cx="280" cy="60" r="5" fill="#818cf8" class="bg-node-delayed" />
    <circle cx="980" cy="85" r="4.5" fill="#c084fc" class="bg-node-slow" />
    <circle cx="1060" cy="270" r="6" fill="#38bdf8" class="bg-node" />
    <circle cx="120" cy="280" r="3.5" fill="#818cf8" class="bg-node-delayed" />
    <circle cx="920" cy="290" r="5" fill="#38bdf8" class="bg-node-slow" />

    <!-- Radar Pulse in Background Center-Right -->
    <circle cx="1050" cy="180" r="40" fill="none" stroke="#38bdf8" class="radar-pulse" />
    <circle cx="1050" cy="180" r="5" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- FOREGROUND: CONTENT & TYPOGRAPHY (Always crisp, high contrast, strictly in foreground) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(100, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="32" y="19" class="badge-label" fill="#38bdf8">PRIVACY &amp; SECURITY STACK</text>
    </g>

    <!-- Main Shield Icon with Ambient Glow -->
    <g transform="translate(100, 115)" class="shield-icon">
      <!-- Shield Shape -->
      <path d="M 45 5 L 85 22 C 85 65 52 95 45 105 C 38 95 5 65 5 22 Z" fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="3" />
      <!-- Inner Checkmark / Slash -->
      <path d="M 28 50 L 40 62 L 64 36" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Title and Subtitle Text Block -->
    <g transform="translate(210, 155)">
      <text class="title-text">
        Awesome <tspan class="gradient-word">Content &amp; Ad Blocking</tspan>
      </text>
      <text y="42" class="subtitle-text">
        DNS Sinkholes • Privacy Resolvers • Browser Extensions • Manifest V3 Mitigations
      </text>
    </g>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(210, 245)">
      <!-- Pill 1: DNS Sinkholes -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🛡️ Pi-hole &amp; AGH</text>
      </g>

      <!-- Pill 2: Browser Filtering -->
      <g transform="translate(185, 0)">
        <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">⚡ uBlock Origin</text>
      </g>

      <!-- Pill 3: Encrypted DNS -->
      <g transform="translate(365, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🔒 DoH / DoT / DoQ</text>
      </g>

      <!-- Pill 4: Zero Tracking -->
      <g transform="translate(560, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🚫 100% Anti-Tracker</text>
      </g>
    </g>
  </g>
</svg>
